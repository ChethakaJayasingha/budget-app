<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <title>Budget</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <section id="home" class="screen">
    <div class="balance">
      <p class="label">Balance</p>
      <p id="balance" class="total">Rs. 0</p>
    </div>

    <form id="entry-form" novalidate>
      <fieldset class="type-toggle">
        <legend class="visually-hidden">Type</legend>
        <label class="type credit"><input type="radio" name="type" value="cr" checked><span>Credit +</span></label>
        <label class="type debit"><input type="radio" name="type" value="de"><span>Debit −</span></label>
      </fieldset>

      <label class="field">
        <span>Amount</span>
        <input id="amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0">
      </label>
      <label class="field">
        <span>Purpose</span>
        <input id="purpose" name="purpose" maxlength="60" autocomplete="off" autocapitalize="sentences"
               enterkeyhint="done" placeholder="e.g. Lunch">
      </label>
      <p id="error" class="error" role="alert"></p>
      <button type="submit" class="submit">Submit</button>
    </form>

    <button type="button" id="open-history" class="secondary">Statement History</button>
  </section>

  <section id="history" class="screen" hidden>
    <button type="button" id="back" class="back">← Go Back</button>
    <h1>Statement History</h1>

    <div class="table-wrap">
      <table id="table">
        <thead>
          <tr><th>Date</th><th>Cr/De</th><th class="num">Amount</th><th>Reason</th><th class="num">Balance</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty">No transactions yet.</p>
    </div>

    <footer class="history-footer">
      <p id="hint" class="hint">Long-press a row to delete it.</p>
      <div class="backup">
        <button type="button" id="export">Export backup</button>
        <button type="button" id="import-button">Import backup</button>
        <input type="file" id="import" accept=".json,application/json" hidden>
      </div>
    </footer>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
